<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart CGPA Calculator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --navy:#450a0a;
  --blue:#991b1b;
  --sky:#dc2626;
  --ink:#172033;
  --muted:#64748b;
  --line:#e2e8f0;
  --surface:#fff
}

body{
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at top left,#fecaca 0,transparent 30%),
    radial-gradient(circle at 90% 10%,#fca5a5 0,transparent 25%),
    #f8fafc
}

.wrap{
  width:min(100% - 2rem,1000px);
  margin:0 auto;
  padding:3.5rem 0 4rem
}

.wrap>h1{
  color:var(--navy);
  font-size:clamp(2rem,5vw,3rem);
  letter-spacing:-.055em;
  line-height:1.05;
  font-weight:800;
  margin-bottom:.55rem
}

.wrap>h1::after{
  content:"Plan every semester. See the bigger picture.";
  display:block;
  color:var(--muted);
  font-size:.94rem;
  letter-spacing:0;
  font-weight:400;
  line-height:1.5;
  margin-top:.7rem
}

h3{
  font-size:1rem;
  font-weight:750;
  letter-spacing:-.015em;
  margin-bottom:.9rem
}

.card{
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,.9);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 14px 35px rgba(30,41,59,.09);
  border-radius:18px;
  padding:1.25rem 1.35rem;
  margin-bottom:1rem;
  backdrop-filter:blur(10px);
  animation:rise .35s ease both
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:4px;
  height:100%;
  background:linear-gradient(#dc2626,#991b1b)
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:.5rem
}

label{
  font-size:.78rem;
  color:var(--muted);
  font-weight:650;
  white-space:nowrap
}

input,select{
  height:38px;
  padding:0 10px;
  border:1px solid var(--line);
  border-radius:10px;
  font:inherit;
  font-size:.875rem;
  background:#fff;
  color:var(--ink);
  outline:none;
  transition:border-color .18s,box-shadow .18s
}

input:focus,select:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(153,27,27,.13)
}

select{
  width:auto;
  min-width:170px
}

input[type=number]{
  width:92px
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  margin-top:.5rem;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:12px
}

th,td{
  border-bottom:1px solid var(--line);
  padding:10px 12px;
  text-align:center;
  font-size:.86rem
}

tr:last-child td{
  border-bottom:none
}

th{
  background:#fef2f2;
  color:#334155;
  font-size:.72rem;
  font-weight:750;
  letter-spacing:.04em;
  text-transform:uppercase
}

td{
  background:rgba(255,255,255,.72)
}

.btn{
  height:38px;
  padding:0 14px;
  border:1px solid #fecaca;
  border-radius:10px;
  background:#fff;
  color:#7f1d1d;
  cursor:pointer;
  font-size:.82rem;
  font-weight:700;
  transition:transform .18s,box-shadow .18s,background .18s;
  white-space:nowrap
}

.btn:hover{
  background:#fef2f2;
  transform:translateY(-1px);
  box-shadow:0 5px 14px rgba(153,27,27,.13)
}

.btn:active{
  transform:translateY(0)
}

.btn-sm{
  height:30px;
  padding:0 10px;
  font-size:.72rem
}

.btn-danger{
  color:#dc2626;
  border-color:#fecaca
}

.btn-danger:hover{
  background:#fef2f2;
  box-shadow:none
}

.toolbar{
  display:flex;
  gap:9px;
  margin:1.6rem 0;
  flex-wrap:wrap
}

.toolbar .btn:nth-child(3){
  background:var(--blue);
  border-color:var(--blue);
  color:#fff
}

.toolbar .btn:nth-child(3):hover{
  background:#7f1d1d
}

.toolbar .btn:nth-child(4){
  background:var(--navy);
  border-color:var(--navy);
  color:#fff
}

.toolbar .btn:nth-child(4):hover{
  background:#2f0707
}

.gpa-info{
  font-size:.82rem;
  color:var(--muted);
  font-weight:600;
  margin-top:.5rem
}

.semester-name{
  height:auto;
  width:min(100%,360px);
  padding:3px 0;
  border:none;
  border-bottom:1px dashed #fca5a5;
  border-radius:0;
  background:transparent;
  color:var(--ink);
  font-size:1rem;
  font-weight:750;
  letter-spacing:-.015em
}

.semester-name:focus{
  border-bottom-color:var(--blue);
  box-shadow:none
}

.summary-total td{
  font-weight:800;
  background:#fef2f2;
  color:#7f1d1d
}

.cgpa-big{
  font-size:2.8rem;
  font-weight:800;
  letter-spacing:-.07em;
  line-height:1.1
}

.cgpa-label{
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  opacity:.78
}

.result-card{
  background:linear-gradient(135deg,#450a0a,#991b1b 60%,#dc2626);
  color:#fff;
  border-radius:16px;
  padding:1.3rem 1.5rem;
  margin-top:1.2rem;
  display:inline-block;
  min-width:210px;
  box-shadow:0 14px 25px rgba(153,27,27,.26)
}

.divider{
  border:none;
  border-top:1px solid rgba(148,163,184,.4);
  margin:2.4rem 0 1.5rem
}

@keyframes rise{
  from{
    opacity:0;
    transform:translateY(8px)
  }
  to{
    opacity:1;
    transform:translateY(0)
  }
}

@media(max-width:600px){
  .wrap{
    width:min(100% - 1.25rem,1000px);
    padding-top:2rem
  }

  .card{
    padding:1.05rem
  }

  .toolbar .btn{
    flex:1 1 calc(50% - 9px)
  }

  .row{
    align-items:flex-start;
    flex-direction:column
  }

  .row input,.row select{
    width:100%;
    max-width:none
  }

  .semester-name{
    width:210px
  }

  th,td{
    padding:8px 5px;
    font-size:.75rem
  }

  td input[type=number]{
    width:64px!important
  }

  .result-card{
    width:100%;
    text-align:center
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>Smart CGPA calculator</h1>

<div class="toolbar">
  <button class="btn" onclick="addPrevious()">+ Add previous entry</button>
  <button class="btn" onclick="addSemester()">+ Add current semester</button>
  <button class="btn" onclick="recalculate()">Recalculate</button>
  <button class="btn" onclick="exportPdf()">Export as PDF</button>
</div>

<div id="entries"></div>

<hr class="divider">

<h3>Final summary</h3>

<div id="summary"></div>

</div>

<script>

let data = [];

function computeLabels() {
  let counter = 1;

  return data.map(e => {

    let label;

    if (e.kind === 'prev') {

      if (e.type === 'cgpa') {

        let upto = e.uptoSem || 0;

        label = upto > 0
          ? `Sem 1 – ${upto} (previous CGPA)`
          : `Previous CGPA`;

        counter = upto + 1;

      } else {

        label = `Sem ${counter} (previous GPA)`;
        counter += 1;

      }

    } else {

      label = `Sem ${counter} (current)`;
      counter += 1;

    }

    return e.label && e.label.trim()
      ? e.label.trim()
      : label;

  });
}


function addPrevious() {

  data.push({
    kind:'prev',
    type:'gpa',
    v:0,
    credits:0,
    uptoSem:0,
    label:''
  });

  render();

}


function addSemester() {

  data.push({
    kind:'sem',
    subjects:[],
    gpa:0,
    credits:0,
    label:''
  });

  render();

}


function removeEntry(i) {

  data.splice(i, 1);

  render();

}


function addSubject(i) {

  data[i].subjects.push({
    name:`Subject ${data[i].subjects.length + 1}`,
    grade:0,
    credit:0
  });

  render();

}


function removeSubject(i, j) {

  data[i].subjects.splice(j, 1);

  render();

}


function setField(i, field, val) {

  if (field === 'type')
    data[i][field] = val;
  else
    data[i][field] = parseFloat(val) || 0;

}


function setEntryLabel(i, val) {

  data[i].label = val;

}


function escapeHtml(value) {

  return String(value).replace(/[&<>'"]/g, character => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    "'":'&#39;',
    '"':'&quot;'
  })[character]);

}


function setSubject(i, j, field, val) {

  data[i].subjects[j][field] =
    field === 'name'
      ? val
      : parseFloat(val) || 0;

}


function calcSem(i) {

  let s=0, c=0;

  data[i].subjects.forEach(sub => {
    s += sub.grade * sub.credit;
    c += sub.credit;
  });

  data[i].gpa = c ? s/c : 0;
  data[i].credits = c;

}


function recalculate() {

  let totalC=0, totalW=0;

  data.forEach((e, i) => {

    if (e.kind === 'prev') {

      if (e.type === 'cgpa') {

        totalC = e.credits;
        totalW = e.v * e.credits;

      } else {

        totalC += e.credits;
        totalW += e.v * e.credits;

      }

    } else {

      calcSem(i);

      totalC += e.credits;
      totalW += e.gpa * e.credits;

    }

  });

  let cgpa = totalC ? totalW / totalC : 0;

  render();

  renderSummary(totalC, cgpa);

}


function render() {

  let labels = computeLabels();

  let c = document.getElementById('entries');

  c.innerHTML = '';

  data.forEach((e, i) => {

    let div = document.createElement('div');

    div.className = 'card';

    if (e.kind === 'prev') {

      div.innerHTML = `

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">

          <input
            class="semester-name"
            value="${escapeHtml(labels[i])}"
            aria-label="Entry name"
            onchange="setEntryLabel(${i},this.value);render()"
          >

          <button
            class="btn btn-sm btn-danger"
            onclick="removeEntry(${i})"
          >
            Remove
          </button>

        </div>

        <div class="row">

          <label>Type</label>

          <select onchange="setField(${i},'type',this.value);render()">

            <option value="gpa" ${e.type==='gpa'?'selected':''}>
              GPA (single semester)
            </option>

            <option value="cgpa" ${e.type==='cgpa'?'selected':''}>
              CGPA (cumulative)
            </option>

          </select>

          ${
            e.type==='cgpa'
            ? `
              <label>Up to sem</label>

              <input
                type="number"
                value="${e.uptoSem}"
                onchange="setField(${i},'uptoSem',this.value);render()"
                min="1"
              >
            `
            : ''
          }

          <label>${e.type==='cgpa'?'CGPA':'GPA'}</label>

          <input
            type="number"
            value="${e.v}"
            step="0.01"
            onchange="setField(${i},'v',this.value)"
            min="0"
            max="10"
          >

          <label>Credits</label>

          <input
            type="number"
            value="${e.credits}"
            onchange="setField(${i},'credits',this.value)"
            min="0"
          >

        </div>

      `;

    } else {

      let rows = '';

      e.subjects.forEach((s, j) => {

        rows += `

          <tr>

            <td>
              <input
                type="text"
                value="${escapeHtml(s.name || `Subject ${j+1}`)}"
                aria-label="Subject name"
                placeholder="Subject ${j+1}"
                style="width:150px"
                onchange="setSubject(${i},${j},'name',this.value)"
              >
            </td>

            <td>
              <input
                type="number"
                value="${s.grade}"
                step="0.01"
                style="width:80px"
                onchange="setSubject(${i},${j},'grade',this.value)"
                min="0"
                max="10"
              >
            </td>

            <td>
              <input
                type="number"
                value="${s.credit}"
                style="width:80px"
                onchange="setSubject(${i},${j},'credit',this.value)"
                min="0"
              >
            </td>

            <td>
              <button
                class="btn btn-sm btn-danger"
                onclick="removeSubject(${i},${j});render()"
              >
                Remove
              </button>
            </td>

          </tr>

        `;

      });

      div.innerHTML = `

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem">

          <input
            class="semester-name"
            value="${escapeHtml(labels[i])}"
            aria-label="Entry name"
            onchange="setEntryLabel(${i},this.value);render()"
          >

          <button
            class="btn btn-sm btn-danger"
            onclick="removeEntry(${i})"
          >
            Remove
          </button>

        </div>

        <table>

          <tr>
            <th>Subject</th>
            <th>Grade</th>
            <th>Credits</th>
            <th></th>
          </tr>

          ${rows}

        </table>

        <div style="margin-top:.5rem">

          <button
            class="btn btn-sm"
            onclick="addSubject(${i});render()"
          >
            + Add subject
          </button>

        </div>

        <p
          class="gpa-info"
          style="margin-top:.5rem"
        >
          GPA: ${e.gpa ? e.gpa.toFixed(2) : '—'}
          &nbsp;|&nbsp;
          Credits: ${e.credits||0}
        </p>

      `;

    }

    c.appendChild(div);

  });

}


function renderSummary(totalC, cgpa) {

  let labels = computeLabels();

  let rows = '';

  data.forEach((e, i) => {

    if (e.kind === 'prev') {

      rows += `
        <tr>
          <td>${escapeHtml(labels[i])}</td>
          <td>${e.credits}</td>
          <td>${parseFloat(e.v).toFixed(2)}</td>
        </tr>
      `;

    } else {

      rows += `
        <tr>
          <td>${escapeHtml(labels[i])}</td>
          <td>${e.credits||0}</td>
          <td>${e.gpa ? e.gpa.toFixed(2) : '—'}</td>
        </tr>
      `;

    }

  });

  document.getElementById('summary').innerHTML = `

    <table>

      <tr>
        <th>Entry</th>
        <th>Credits</th>
        <th>Value</th>
      </tr>

      ${rows}

      <tr class="summary-total">

        <td>Total</td>

        <td>${totalC}</td>

        <td>${cgpa.toFixed(2)}</td>

      </tr>

    </table>

    <div class="result-card">

      <div class="cgpa-label">
        Overall CGPA
      </div>

      <div class="cgpa-big">
        ${cgpa.toFixed(2)}
      </div>

    </div>

  `;

}


function exportPdf() {

  recalculate();

  const labels = computeLabels();

  let totalCredits = 0;

  let totalWeightedPoints = 0;

  const lines = [

    {
      text:'CGPA CALCULATION SUMMARY',
      size:20,
      gap:28
    },

    {
      text:`Generated: ${new Date().toLocaleDateString()}`,
      size:10,
      gap:24
    },

    {
      text:'ENTRY                                                CREDITS       GPA / CGPA',
      size:10,
      gap:18
    }

  ];

  data.forEach((entry, index) => {

    const value =
      entry.kind === 'prev'
        ? entry.v
        : entry.gpa;

    const credits =
      entry.credits || 0;

    if (
      entry.kind === 'prev' &&
      entry.type === 'cgpa'
    ) {

      totalCredits = credits;

      totalWeightedPoints = value * credits;

    } else {

      totalCredits += credits;

      totalWeightedPoints += value * credits;

    }

    lines.push({

      text:
        `${labels[index].padEnd(52).slice(0, 52)}`
        +
        `${String(credits).padStart(8)}`
        +
        `${(value ? value.toFixed(2) : '-').padStart(16)}`,

      size:10,

      gap:15

    });

  });

  const cgpa =
    totalCredits
      ? totalWeightedPoints / totalCredits
      : 0;

  lines.push(

    {
      text:'________________________________________________________________________________',
      size:10,
      gap:18
    },

    {
      text:
        `TOTAL${String(totalCredits).padStart(54)}${cgpa.toFixed(2).padStart(16)}`,
      size:11,
      gap:28
    },

    {
      text:`OVERALL CGPA: ${cgpa.toFixed(2)}`,
      size:16,
      gap:20
    }

  );

  const pdf = createPdf(lines);

  const url =
    URL.createObjectURL(
      new Blob([pdf], { type:'application/pdf' })
    );

  const link = document.createElement('a');

  link.href = url;

  link.download = 'cgpa-summary.pdf';

  document.body.appendChild(link);

  link.click();

  link.remove();

  setTimeout(
    () => URL.revokeObjectURL(url),
    1000
  );

}


function createPdf(lines) {

  let y = 805;

  const commands = lines.map(line => {

    const command =
      `BT /F1 ${line.size} Tf 40 ${y} Td (${escapePdfText(line.text)}) Tj ET`;

    y -= line.gap;

    return command;

  }).join('\n');

  const objects = [

    '<< /Type /Catalog /Pages 2 0 R >>',

    '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',

    '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',

    `<< /Length ${commands.length} >>\nstream\n${commands}\nendstream`,

    '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'

  ];

  let pdf = '%PDF-1.4\n';

  const offsets = [0];

  objects.forEach((object, index) => {

    offsets.push(pdf.length);

    pdf +=
      `${index + 1} 0 obj\n`
      +
      `${object}\n`
      +
      `endobj\n`;

  });

  const xrefPosition = pdf.length;

  pdf +=
    `xref\n`
    +
    `0 ${objects.length + 1}\n`
    +
    `0000000000 65535 f \n`;

  offsets.slice(1).forEach(offset => {

    pdf +=
      `${String(offset).padStart(10, '0')} 00000 n \n`;

  });

  return (
    `${pdf}`
    +
    `trailer\n`
    +
    `<< /Size ${objects.length + 1} /Root 1 0 R >>\n`
    +
    `startxref\n`
    +
    `${xrefPosition}\n`
    +
    `%%EOF`
  );

}


function escapePdfText(value) {

  return String(value)
    .normalize('NFKD')
    .replace(/[^\x20-\x7E]/g, '-')
    .replace(/\\/g, '\\\\')
    .replace(/\(/g, '\\(')
    .replace(/\)/g, '\\)');

}


addPrevious();

addSemester();

</script>

</body>
</html>
